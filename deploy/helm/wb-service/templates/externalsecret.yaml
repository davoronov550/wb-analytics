{{- if .Values.secrets }}
# Секреты приходят из Vault через External Secrets. В values и в git попадает
# только путь до значения — само значение не попадает никуда.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "wb-service.name" . }}
  labels: {{- include "wb-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "wb-service.name" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key }}
    {{- end }}
{{- end }}
