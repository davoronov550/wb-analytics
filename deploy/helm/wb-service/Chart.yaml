# Один чарт на все девять сервисов (T063).
#
# Чарт на сервис разошёлся бы: девятый не получил бы того, что первый узнал про
# пробы, PDB или лимиты. Различия между сервисами живут в
# `services/<имя>/helm-values.yaml`, а не в отдельных копиях шаблонов.
apiVersion: v2
name: wb-service
description: Общий чарт для сервисов платформы WB Analytics
type: application
# Версия чарта. Версия приложения задаётся тегом образа из CI, поэтому
# appVersion здесь намеренно нет: одно место истины на версию сервиса.
version: 0.1.0
