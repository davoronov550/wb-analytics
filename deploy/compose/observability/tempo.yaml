# Приём и хранение трасс в dev (T006).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # gRPC — то, чем ходит `configure_tracing` из libs/platform.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Трассы в dev живут сутки: держать больше незачем, а том растёт быстро.
compactor:
  compaction:
    block_retention: 24h
