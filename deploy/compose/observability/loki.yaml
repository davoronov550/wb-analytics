# Хранение логов в dev (T006). Однопроцессный режим, файловая система вместо
# объектного хранилища — распределённая схема в dev ничего не проверяет.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Структурированные логи из structlog заметно больше строчных.
  max_line_size: 512KB
  reject_old_samples: true
  reject_old_samples_max_age: 24h
