# Схемы событий Kafka и внутренних gRPC-интерфейсов — один язык описания на всю
# систему (T007).
#
# `buf breaking` здесь обязательный гейт в CI, а не удобство. Schema Registry
# в режиме BACKWARD проверяет совместимость на уровне провода и потому слеп к
# подмене типа внутри одного класса кодирования: `int32` → `bool` он принимает,
# хотя потребитель получит бессмыслицу. Проверено на поднятом реестре, таблица
# в док. 4, §«Почему нужны оба гейта схем». `buf` работает с исходником и ловит
# именно этот класс изменений.
version: v2

modules:
  # События Kafka: четыре топика из док. 3, §3.3.
  - path: events
  # Синхронные интерфейсы: api-gateway → сервисы, export → catalog,
  # notifications → catalog (док. 3, §3.4a).
  - path: grpc

lint:
  use:
    - STANDARD

breaking:
  # FILE, а не PACKAGE: перенос сообщения между файлами для потребителя
  # безобиден, но для нас это сигнал, что схема события переехала, — а событие
  # с четырьмя подписчиками переезжать молча не должно.
  use:
    - FILE
