# Values for the shared `deploy/helm/wb-service` chart (T063).
#
# One chart, nine value files. A chart per service would drift: the ninth would
# be missing whatever the first learned about probes or resource limits.

name: {{ cookiecutter.service_name }}
image:
  repository: ghcr.io/davoronov550/wb-{{ cookiecutter.service_name }}
  # Tag is set by CI to the commit SHA. Never `latest`: it makes a rollback
  # ambiguous, which is the one moment it must not be.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: {{ cookiecutter.http_port }}
{%- if cookiecutter.has_grpc == 'yes' %}
  grpcPort: {{ cookiecutter.grpc_port }}
{%- endif %}

# Requests are what the scheduler packs by; limits are what the kernel enforces.
# Requests set below the steady-state usage cause eviction under pressure.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # No CPU limit on purpose: CFS throttling adds tail latency at exactly the
    # moment a service is busy. Memory is limited because there is no graceful
    # degradation for exhausting it.
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 10
    # Tighter than liveness: leaving the load balancer is cheap and reversible,
    # a restart is neither.
    failureThreshold: 2

# Kubernetes must not take the last pod down during a node drain.
podDisruptionBudget:
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
{%- if cookiecutter.has_kafka == 'yes' %}
  # Consumers scale on how far behind they are, not on CPU: a consumer waiting
  # on a slow downstream is idle and lagging at the same time.
  keda:
    # Выключена до фазы 2: у сервиса пока нет топика, на отставание по которому
    # можно масштабироваться. Чарт требует `topic` и `bootstrapServers` при
    # включении — наполовину настроенный автоскейлер хуже отсутствующего, и
    # рендеринг падает, а не разворачивает его молча.
    enabled: false
    lagThreshold: "1000"
    # topic: ingestion.products.observed.v1
    # bootstrapServers: kafka-bootstrap.kafka.svc:9092
{%- endif %}

env:
  SERVICE_NAME: {{ cookiecutter.service_name }}
  ENVIRONMENT: production
  LOG_LEVEL: info

# Values come from Vault via External Secrets — never from this file.
secrets:
{%- if cookiecutter.has_database == 'yes' %}
  - name: DB_DSN
    key: {{ cookiecutter.service_name }}/database/dsn
{%- endif %}
{%- if cookiecutter.has_kafka == 'yes' %}
  - name: KAFKA_BOOTSTRAP_SERVERS
    key: shared/kafka/bootstrap
{%- endif %}
{%- if cookiecutter.has_redis == 'yes' %}
  - name: REDIS_DSN
    key: shared/redis/dsn
{%- endif %}
