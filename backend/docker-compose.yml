# Local development infrastructure for the WB Analytics backend.
# Start with:  docker compose up -d
# The app itself (web / Celery worker / Celery beat) runs on the host during
# development; this file provides only the backing services (PostgreSQL + Redis).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wb_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only on a fresh volume. On an existing volume apply
      # db/init/01-app-role.sql by hand.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wb_analytics}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command:
      ["redis-server", "--save", "", "--appendonly", "no",
       "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
