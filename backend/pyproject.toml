[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-analytics-backend"
version = "0.1.0"
description = "Wildberries product analytics service — hexagonal, multi-context backend"
requires-python = ">=3.12"

# Runtime dependencies. Frameworks/drivers are used ONLY inside adapters
# (Constitution III); the domain/application layers import none of these.
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-filter>=24.2",
    "django-cors-headers>=4.4",
    "djangorestframework-simplejwt>=5.3",   # JWT auth (FE-09)
    "psycopg[binary]>=3.2",                  # PostgreSQL driver
    "httpx>=0.27",                           # WB gateway adapter
    "celery>=5.4",                           # async + scheduled work (FE-01/FE-02)
    "redis>=5.0",                            # Celery broker/result
    "openpyxl>=3.1",                         # XLSX export (FE-08)
    "google-auth>=2.0",                      # verify Google ID tokens (FE-09 sign-in)
    "requests>=2.31",                        # HTTP transport for google-auth cert fetch
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "respx>=0.21",           # offline WB gateway tests
    "coverage[toml]>=7.5",
    "ruff>=0.5",
    "black>=24.4",
]

# `src/` is the import root: each bounded context (shared, catalog, analytics,
# scheduling, notifications, accounts) is a top-level package discovered here, so
# `pip install -e .` puts them on the import path (see quickstart.md).
[tool.setuptools.packages.find]
where = ["src"]

# --- Linting / import sorting (ruff) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

# --- Formatting (black) ---
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Tests (pytest + pytest-django) ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
# `src` = bounded-context packages; `.` = the `config` project package.
pythonpath = ["src", "."]
addopts = "--strict-markers"

# --- Coverage (≥80% gate — Constitution II) ---
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
